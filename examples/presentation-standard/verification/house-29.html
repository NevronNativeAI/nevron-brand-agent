﻿/* Stage mechanics only. Layout geometry and type sizes are extracted data. */
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #111; }
body { overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; transform-origin: center; }
/* `contain` matters for the PDF, not the screen. Shapes may hang off the slide
   edge — legal in PowerPoint, which clips at the slide boundary. overflow:hidden
   clips the paint, but Chrome's print fitter reads raw descendant layout and
   shrinks every page to make the widest one fit, which is why slides printed at
   ~67% inside correct pages. Size containment stops that; it is safe because the
   renderer always writes an explicit width and height on the slide. */
.slide { position: relative; display: none; overflow: hidden; isolation: isolate;
         contain: size layout paint; }
.slide.active { display: block; }
.shape, .group, .geometry, .text, .picture { position: absolute; }
.shape { transform-origin: center; }
.group { transform-origin: 0 0; }
.geometry, .picture { left: 0; top: 0; }
.text { inset: 0; display: flex; flex-direction: column; overflow: visible; }
.text p { padding: 0; margin: 0; overflow-wrap: normal; }
.text-content { flex: none; width: 100%; }
.bullet { display: inline-block; padding-right: .4em; }
.picture { width: 100%; height: 100%; overflow: hidden; }
.picture img { position: absolute; max-width: none; }
.missing { width: 100%; height: 100%; background: #ffb81c; color: #010232; padding: 12px; font: 12px sans-serif; }
table { border-collapse: collapse; table-layout: fixed; }
td { position: relative; padding: 0; }
@media print {
  html, body { width: auto; height: auto; overflow: visible; background: transparent; }
  .stage { position: static; transform: none !important; margin: 0; }
  .slide, .slide.active { display: block; break-after: page; break-inside: avoid; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .slide:last-child { break-after: auto; }
}
.text { font-family: 'Open Sans', sans-serif; }
@media print { .stage { zoom: 1.3333333333333333; } }

/* ==========================================================================
   Deck navigation chrome. Never printed, never part of a slide.
   Radius 0 throughout — hard brand rule. One accent: Nevron blue.
   ========================================================================== */

:root {
  --ui-navy: #000126;
  --ui-blue: #1B92FF;
  --ui-blue-2: #73C7FF;
  --ui-line: rgba(255,255,255,.18);
}

.deck-ui, .deck-progress, .deck-grid, .deck-help { font-family: 'Open Sans', system-ui, sans-serif; }

/* ---- bottom control bar -------------------------------------------------- */

.deck-ui {
  position: fixed; z-index: 40; left: 50%; bottom: 18px;
  transform: translateX(-50%);
  display: flex; align-items: stretch; gap: 1px;
  background: var(--ui-line);
  border: 1px solid var(--ui-line);
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease;
}
.deck-ui.is-visible { opacity: 1; pointer-events: auto; }
body.overview .deck-ui { opacity: 1; pointer-events: auto; }

.ui-btn {
  appearance: none; border: 0; cursor: pointer;
  background: var(--ui-navy); color: #fff;
  font: 600 14px/1 'Open Sans', system-ui, sans-serif;
  min-width: 40px; padding: 0 12px;
  display: grid; place-items: center;
  transition: background-color .15s ease, color .15s ease;
}
.ui-btn:hover { background: var(--ui-blue); }
.ui-btn:disabled { opacity: .35; cursor: default; }
.ui-btn:disabled:hover { background: var(--ui-navy); }
.ui-btn[aria-pressed="true"] { background: var(--ui-blue); }
.ui-btn:focus-visible { outline: 2px solid var(--ui-blue-2); outline-offset: -2px; }

.ui-count {
  background: var(--ui-navy); color: rgba(255,255,255,.62);
  font: 600 12px/1 'Open Sans', system-ui, sans-serif;
  letter-spacing: .06em; padding: 0 14px; min-width: 78px; white-space: nowrap;
  /* flex, not grid: a grid container turns the <b> and the "/27" text node
     into separate grid items and stacks them on two rows */
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.ui-count b { color: #fff; font-weight: 700; }

/* ---- progress ------------------------------------------------------------ */

.deck-progress {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; height: 3px;
  background: rgba(0,1,38,.18);
}
.deck-progress i { display: block; height: 100%; width: 0; background: var(--ui-blue); transition: width .2s ease; }
body.overview .deck-progress { display: none; }

/* ---- overview grid ------------------------------------------------------- */

.deck-grid {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto;
  background: var(--ui-navy);
  display: grid; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  gap: 14px; padding: 18px 18px 84px;
}
.deck-grid[hidden] { display: none; }

.cell {
  appearance: none; padding: 0; cursor: pointer; text-align: left;
  background: none; border: 1px solid var(--ui-line);
  display: block; position: relative; overflow: hidden;
  transition: border-color .15s ease;
}
.cell:hover, .cell:focus-visible { border-color: var(--ui-blue); outline: none; }
.cell.is-current { border-color: var(--ui-blue-2); box-shadow: inset 0 0 0 2px var(--ui-blue-2); }
/* zoom (not transform) so the thumbnail occupies real layout space */
.cell .slide { display: block !important; }
.cell__num {
  position: absolute; left: 0; bottom: 0; z-index: 2;
  background: var(--ui-navy); color: #fff;
  font: 600 11px/1 'Open Sans', system-ui, sans-serif;
  letter-spacing: .08em; padding: 5px 8px;
}
.cell__label {
  position: absolute; right: 0; bottom: 0; z-index: 2;
  background: rgba(0,1,38,.82); color: rgba(255,255,255,.72);
  font: 400 10px/1.2 'Open Sans', system-ui, sans-serif;
  padding: 5px 8px; max-width: 70%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---- keyboard help ------------------------------------------------------- */

.deck-help {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: rgba(0,1,38,.86);
}
.deck-help[hidden] { display: none; }
.deck-help dl {
  background: var(--ui-navy); border: 1px solid var(--ui-line);
  color: #fff; margin: 0; padding: 26px 30px;
  display: grid; grid-template-columns: auto 1fr; gap: 10px 22px;
  font-size: 13px; min-width: 300px;
}
.deck-help dt {
  font: 600 11px/1.6 ui-monospace, 'Cascadia Mono', Consolas, monospace;
  background: rgba(255,255,255,.1); padding: 2px 8px; justify-self: start;
}
.deck-help dd { margin: 0; color: rgba(255,255,255,.76); align-self: center; }
.deck-help h2 {
  grid-column: 1 / -1; margin: 0 0 6px;
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
}

@media (max-width: 640px) {
  .deck-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .deck-ui { bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .deck-ui, .deck-progress i, .ui-btn, .cell { transition: none; }
}

/* Chrome is never part of the printed deck. */
@media print {
  .deck-ui, .deck-progress, .deck-grid, .deck-help { display: none !important; }
}
