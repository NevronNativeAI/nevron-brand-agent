<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House slide 54</title><style>
﻿/* Stage mechanics only. Layout geometry and type sizes are extracted data. */
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #111; }
body { overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; transform-origin: center; }
.slide { position: relative; display: none; overflow: hidden; isolation: isolate; }
.slide.active { display: block; }
.shape, .group, .geometry, .text, .picture { position: absolute; }
.shape { transform-origin: center; }
.group { transform-origin: 0 0; }
.geometry, .picture { left: 0; top: 0; }
.text { inset: 0; display: flex; flex-direction: column; overflow: visible; }
.text p { padding: 0; margin: 0; overflow-wrap: normal; }
.text-content { flex: none; width: 100%; }
.bullet { display: inline-block; padding-right: .4em; }
.picture { width: 100%; height: 100%; overflow: hidden; }
.picture img { position: absolute; max-width: none; }
.missing { width: 100%; height: 100%; background: #ffb81c; color: #010232; padding: 12px; font: 12px sans-serif; }
table { border-collapse: collapse; table-layout: fixed; }
td { position: relative; padding: 0; }
@media print {
  html, body { width: auto; height: auto; overflow: visible; background: transparent; }
  .stage { position: static; transform: none !important; margin: 0; }
  .slide, .slide.active { display: block; break-after: page; break-inside: avoid; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .slide:last-child { break-after: auto; }
}
.text { font-family: 'Open Sans', sans-serif; }
@media print { .stage { zoom: 1.3333333333333333; } }

xt-indent:0px"><span style="font-family:'Arial',sans-serif;font-size:18px;font-weight:400;font-style:normal;color:#000000;letter-spacing:0px;"> </span></p></div></div></div><div class="shape" data-shape="4" data-source="ppt/slides/slide54.xml" style="left:468.923386px;top:48.923228px;width:442.153543px;height:442.153543px;transform:rotate(0deg) scale(1,1);"><div class="picture"><img alt="Picture 3" src="media/6724385fa4a4518f.png" style="width:100%;height:100%;left:0%;top:0%"></div></div></section></main><script>const slides=[...document.querySelectorAll('.slide')],stage=document.querySelector('.stage');let current=0;
function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===current));location.hash=String(current+1);}
function resize(){stage.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/960,innerHeight/540)+')';}addEventListener('resize',resize);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);});
addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>0&&n<=slides.length)show(n-1);});show(Number(location.hash.slice(1)||1)-1);resize();
window.deckReady=document.fonts.ready.then(async()=>{await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));document.documentElement.dataset.ready='true';return true;});window.deckReady.then(()=>{
    const errors=[];for(const t of document.querySelectorAll('.text')){const s=t.closest('.shape'),b=s.getBoundingClientRect(),c=t.querySelector('.text-content').getBoundingClientRect();if(!t.textContent.trim()||b.right<0||b.bottom<0||b.left>innerWidth||b.top>innerHeight)continue;
    const p=getComputedStyle(t);if(c.bottom>b.bottom-parseFloat(p.paddingBottom)*innerWidth/960+2)errors.push({shape:s.dataset.shape,kind:'vertical-text-overflow'});}
    for(const im of document.images)if(!im.complete||!im.naturalWidth)errors.push({kind:'missing-image',src:im.getAttribute('src')});
    const report=document.createElement('script');report.type='application/json';report.id='diagnostics';report.textContent=JSON.stringify(errors);document.body.append(report);
  });</script></body></html>
